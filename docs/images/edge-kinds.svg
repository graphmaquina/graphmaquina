<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Edge kinds of the loan machine</title><desc id="desc">The loan machine with its ordinary edges, which requests take, the gate REQUEST_EXTENSION, a dotted self-loop that only a check asks, and the external edge REPORT_LOST, dashed, which another system takes and which still makes LOST reachable.</desc>
<defs><linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#15263e"/><stop offset="1" stop-color="#0b1220"/></linearGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#7692b0" opacity=".12"/></pattern></defs>
<rect x="0" y="0" width="1440" height="900" rx="24" fill="url(#back)" />
<rect x="0" y="0" width="1440" height="900" rx="24" fill="url(#grid)" />
<text x="52" y="50" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#55e0c0" text-anchor="start">GRAPHMAQUINA / EDGE KINDS</text>
<text x="52" y="108" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="43" font-weight="700" fill="#f2f6fc" text-anchor="start">A gate is asked. An external edge happens elsewhere.</text>
<text x="52" y="151" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="400" fill="#a9b8ce" text-anchor="start">One loan machine: ordinary edges that requests take, a gate that only checks ask, and an edge another system takes.</text>
<rect x="110" y="330" width="260" height="120" rx="16" fill="#131f32" stroke="#2b3c54" stroke-width="2" />
<rect x="110" y="346" width="4" height="88" rx="2" fill="#7aafff" />
<text x="240.0" y="388.0" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#f2f6fc" text-anchor="middle">BORROWED</text>
<text x="240.0" y="416.0" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="#a9b8ce" text-anchor="middle">initial</text>
<rect x="590" y="330" width="260" height="120" rx="16" fill="#131f32" stroke="#2b3c54" stroke-width="2" />
<rect x="590" y="346" width="4" height="88" rx="2" fill="#ffc77a" />
<text x="720.0" y="388.0" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#f2f6fc" text-anchor="middle">OVERDUE</text>
<text x="720.0" y="416.0" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="#a9b8ce" text-anchor="middle">past its due date</text>
<rect x="1070" y="220" width="260" height="110" rx="16" fill="#131f32" stroke="#2b3c54" stroke-width="2" />
<rect x="1070" y="236" width="4" height="78" rx="2" fill="#55e0c0" />
<text x="1200.0" y="273.0" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#f2f6fc" text-anchor="middle">RETURNED</text>
<text x="1200.0" y="301.0" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="#a9b8ce" text-anchor="middle">terminal</text>
<rect x="1070" y="450" width="260" height="110" rx="16" fill="#131f32" stroke="#2b3c54" stroke-width="2" />
<rect x="1070" y="466" width="4" height="78" rx="2" fill="#c3a2ff" />
<text x="1200.0" y="503.0" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#f2f6fc" text-anchor="middle">LOST</text>
<text x="1200.0" y="531.0" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="#a9b8ce" text-anchor="middle">terminal, written by inventory</text>
<path d="M 370 390 L 584 390" fill="none" stroke="#7aafff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 578 383 L 588 390 L 578 397" fill="none" stroke="#7aafff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="477" y="378" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#7aafff" text-anchor="middle">MARK_OVERDUE</text>
<path d="M 300 330 V 275 H 1064" fill="none" stroke="#55e0c0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 1058 268 L 1068 275 L 1058 282" fill="none" stroke="#55e0c0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 850 360 C 950 360 970 290 1064 290" fill="none" stroke="#55e0c0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 1058 283 L 1068 290 L 1058 297" fill="none" stroke="#55e0c0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="700" y="263" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#55e0c0" text-anchor="middle">RETURN</text>
<path d="M 250 450 C 250 555 350 555 350 456" fill="none" stroke="#ffc77a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="2 9"/>
<path d="M 343 462 L 350 452 L 357 462" fill="none" stroke="#ffc77a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="300" y="584" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#ffc77a" text-anchor="middle">REQUEST_EXTENSION</text>
<text x="300" y="608" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="#a9b8ce" text-anchor="middle">[gate] asked by canRequestExtension</text>
<path d="M 140 450 V 660 H 1200 V 566" fill="none" stroke="#c3a2ff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="12 9"/>
<path d="M 1193 572 L 1200 562 L 1207 572" fill="none" stroke="#c3a2ff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 850 420 C 960 420 960 505 1064 505" fill="none" stroke="#c3a2ff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="12 9"/>
<path d="M 1058 498 L 1068 505 L 1058 512" fill="none" stroke="#c3a2ff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="720" y="648" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#c3a2ff" text-anchor="middle">REPORT_LOST  [external]</text>
<path d="M 110 714 L 190 714" fill="none" stroke="#7aafff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="214" y="720" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#f2f6fc" text-anchor="start">Ordinary edge</text>
<text x="380" y="720" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="400" fill="#a9b8ce" text-anchor="start">A request of its identifier takes it: an operation, execute, a choice, a cascade.</text>
<path d="M 110 766 L 190 766" fill="none" stroke="#ffc77a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="2 9"/>
<text x="214" y="772" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#f2f6fc" text-anchor="start">Gate</text>
<text x="380" y="772" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="400" fill="#a9b8ce" text-anchor="start">Only a check asks it. Its guards and the state's policy answer; nothing executes it, so it needs no allowsCycle.</text>
<path d="M 110 818 L 190 818" fill="none" stroke="#c3a2ff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="12 9"/>
<text x="214" y="824" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#f2f6fc" text-anchor="start">External edge</text>
<text x="380" y="824" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="17" font-weight="400" fill="#a9b8ce" text-anchor="start">Another system takes it. It counts for reachability and cycles; any request or check of it answers NO_TRANSITION.</text>
</svg>
