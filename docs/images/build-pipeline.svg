<text x="74" y="466" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="650" fill="#a9b8ce" text-anchor="start">BUILD TIME</text>
<path d="M 52 486 H 1388" fill="none" stroke="#2b3c54" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 8"/>
<rect x="52" y="516" width="1336" height="106" rx="16" fill="url(#glow)" stroke="#2b3c54" stroke-width="2" />
<text x="78" y="556" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="650" fill="#55e0c0" text-anchor="start">RUNTIME</text>
<text x="78" y="594" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="29" font-weight="600" fill="#f2f6fc" text-anchor="start">Application → typed facade → graphmaquina-core → entity state</text>
<path d="M 52 666 H 1388" fill="none" stroke="#2b3c54" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="52" y="701" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="400" fill="#a9b8ce" text-anchor="start">Generator + processor stay on the build path. Completion publishes META-INF/graphmaquina/exports.json.</text>
