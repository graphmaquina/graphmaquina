<text x="64" y="240" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="600" fill="#a9b8ce" text-anchor="start">FROM ↓ / TO →</text>
