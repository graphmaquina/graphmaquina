<text x="78" y="739" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="25" font-weight="600" fill="#f2f6fc" text-anchor="start">Start with a minimal interface, or write the complete flow before the first build.</text>
