<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="830" viewBox="0 0 1440 830" role="img" aria-labelledby="title desc">
<title id="title">Transition and commit lifecycle</title><desc id="desc">The engine evaluates guards and runs actions, staging the state changes of the root, its cascades and the sub-machines its hops enter, which start at their initial states, in a shared unit of work. Commit checks and writes state. Hooks and watch reactions run afterward, then the observers learn how the call ended; external side effects are not rolled back automatically.</desc>
<defs>
  <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#15263e"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
  <linearGradient id="glow"><stop stop-color="#55e0c0" stop-opacity=".12"/><stop offset="1" stop-color="#7aafff" stop-opacity=".03"/></linearGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#7692b0" opacity=".12"/></pattern>
</defs>
<rect x="0" y="0" width="1440" height="830" rx="24" fill="url(#back)" />
<rect x="0" y="0" width="1440" height="830" rx="24" fill="url(#grid)" />
<text x="52" y="50" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#55e0c0" text-anchor="start">GRAPHMAQUINA / RUNTIME LIFECYCLE</text>
<text x="52" y="108" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="43" font-weight="700" fill="#f2f6fc" text-anchor="start">One root. One shared unit of work.</text>
<text x="52" y="151" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="24" font-weight="400" fill="#a9b8ce" text-anchor="start">Cascades stage changes together. Post-commit work begins after state is written.</text>
<rect x="52" y="205" width="790" height="373" rx="20" fill="url(#glow)" stroke="#2b3c54" stroke-width="2" />
<text x="78" y="246" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#7aafff" text-anchor="start">BEFORE COMMIT</text>
<rect x="78" y="275" width="340" height="158" rx="16" fill="#131f32" stroke="#2b3c54" stroke-width="2" />
<rect x="78" y="293" width="4" height="122" rx="2" fill="#7aafff" />
<text x="102" y="319" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="27" font-weight="650" fill="#f2f6fc" text-anchor="start">Guards + actions</text>
<text x="102" y="359" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="400" fill="#a9b8ce" text-anchor="start">Root operation</text>
<text x="102" y="390" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="400" fill="#a9b8ce" text-anchor="start">Cascades, sub-machines</text>
<rect x="467" y="275" width="347" height="158" rx="16" fill="#131f32" stroke="#2b3c54" stroke-width="2" />
<rect x="467" y="293" width="4" height="122" rx="2" fill="#c3a2ff" />
<text x="491" y="319" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="27" font-weight="650" fill="#f2f6fc" text-anchor="start">Pending changes</text>
<text x="491" y="359" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="400" fill="#a9b8ce" text-anchor="start">Shared unit of work</text>
<text x="491" y="390" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="400" fill="#a9b8ce" text-anchor="start">No state setters yet</text>
<path d="M 421 354 L 463 354" fill="none" stroke="#c3a2ff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 453 347 L 463 354 L 453 361" fill="none" stroke="#c3a2ff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="82" y="488" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="25" font-weight="600" fill="#ff8998" text-anchor="start">Abort → discard planned state changes</text>
<text x="82" y="534" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="400" fill="#a9b8ce" text-anchor="start">Action side effects require application-level handling.</text>
<rect x="902" y="275" width="486" height="158" rx="16" fill="#131f32" stroke="#2b3c54" stroke-width="2" />
<rect x="902" y="293" width="4" height="122" rx="2" fill="#55e0c0" />
<text x="926" y="319" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="27" font-weight="650" fill="#f2f6fc" text-anchor="start">Commit</text>
<text x="926" y="359" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="400" fill="#a9b8ce" text-anchor="start">Check original states</text>
<text x="926" y="390" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="400" fill="#a9b8ce" text-anchor="start">Write final state per entity</text>
<path d="M 842 354 L 902 354" fill="none" stroke="#55e0c0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 892 347 L 902 354 L 892 361" fill="none" stroke="#55e0c0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 1145 433 V 452 H 1408 V 600 H 180 V 627" fill="none" stroke="#55e0c0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 180 610 L 180 627" fill="none" stroke="#55e0c0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 173 617 L 180 627 L 187 617" fill="none" stroke="#55e0c0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="923" y="486" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="21" font-weight="700" fill="#55e0c0" text-anchor="start">STATE IS NOW COMMITTED</text>
<text x="923" y="526" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="23" font-weight="400" fill="#a9b8ce" text-anchor="start">Setters must not throw.</text>
<rect x="52" y="627" width="260" height="99" rx="14" fill="#131f32" stroke="#2b3c54" stroke-width="2" />
<text x="74" y="666" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="25" font-weight="650" fill="#ffc77a" text-anchor="start">Hooks</text>
<text x="74" y="700" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" font-weight="400" fill="#a9b8ce" text-anchor="start">Committed hop order</text>
<rect x="391" y="627" width="307" height="99" rx="14" fill="#131f32" stroke="#2b3c54" stroke-width="2" />
<text x="413" y="666" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="25" font-weight="650" fill="#c3a2ff" text-anchor="start">Watch reactions</text>
<text x="413" y="700" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" font-weight="400" fill="#a9b8ce" text-anchor="start">New root transactions</text>
<rect x="777" y="627" width="240" height="99" rx="14" fill="#131f32" stroke="#2b3c54" stroke-width="2" />
<text x="799" y="666" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="25" font-weight="650" fill="#7aafff" text-anchor="start">Observers</text>
<text x="799" y="700" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" font-weight="400" fill="#a9b8ce" text-anchor="start">Observe outcome</text>
<rect x="1096" y="627" width="292" height="99" rx="14" fill="#131f32" stroke="#2b3c54" stroke-width="2" />
<text x="1118" y="666" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="25" font-weight="650" fill="#55e0c0" text-anchor="start">Return</text>
<text x="1118" y="700" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" font-weight="400" fill="#a9b8ce" text-anchor="start">Outcome + reactions</text>
<path d="M 318 676 L 385 676" fill="none" stroke="#55e0c0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 375 669 L 385 676 L 375 683" fill="none" stroke="#55e0c0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 704 676 L 771 676" fill="none" stroke="#55e0c0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 761 669 L 771 676 L 761 683" fill="none" stroke="#55e0c0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 1023 676 L 1090 676" fill="none" stroke="#55e0c0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 1080 669 L 1090 676 L 1080 683" fill="none" stroke="#55e0c0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 52 766 H 1388" fill="none" stroke="#2b3c54" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="52" y="801" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="400" fill="#a9b8ce" text-anchor="start">Normal completion path. A throwing hook stops the remaining post-commit sequence, but observers are told it failed; committed state remains.</text>
</svg>
