<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="935" viewBox="0 0 1440 935" role="img" aria-labelledby="title desc">
<title id="title">Async binding versus async invocation</title><desc id="desc">A direct operation waits on the caller thread. Using machine.async with the default executor moves the entire operation to a virtual thread, while the caller receives a future. Service completion threads are selected by the service.</desc>
<defs>
  <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#15263e"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
  <linearGradient id="glow"><stop stop-color="#55e0c0" stop-opacity=".12"/><stop offset="1" stop-color="#7aafff" stop-opacity=".03"/></linearGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#7692b0" opacity=".12"/></pattern>
</defs>
<rect x="0" y="0" width="1440" height="935" rx="24" fill="url(#back)" />
<rect x="0" y="0" width="1440" height="935" rx="24" fill="url(#grid)" />
<text x="52" y="50" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#55e0c0" text-anchor="start">GRAPHMAQUINA / ASYNC / TWO CHOICES</text>
<text x="52" y="108" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="43" font-weight="700" fill="#f2f6fc" text-anchor="start">A stage is asynchronous. Your call may still wait.</text>
<text x="52" y="151" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="24" font-weight="400" fill="#a9b8ce" text-anchor="start">The default executor uses virtual threads. A custom executor controls its own scheduling.</text>
<rect x="52" y="206" width="1336" height="257" rx="20" fill="#131f32" stroke="#2b3c54" stroke-width="2" />
<text x="78" y="246" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" font-weight="700" fill="#7aafff" text-anchor="start">A / DIRECT CALL</text>
<text x="78" y="293" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="23" font-weight="650" fill="#f2f6fc" text-anchor="start">Caller</text>
<rect x="247" y="270" width="300" height="128" rx="16" fill="#131f32" stroke="#2b3c54" stroke-width="2" />
<rect x="247" y="288" width="4" height="92" rx="2" fill="#7aafff" />
<text x="271" y="314" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="27" font-weight="650" fill="#f2f6fc" text-anchor="start">Invoke complete()</text>
<text x="271" y="354" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="400" fill="#a9b8ce" text-anchor="start">Action runs inline</text>
<rect x="610" y="270" width="328" height="128" rx="16" fill="#131f32" stroke="#2b3c54" stroke-width="2" />
<rect x="610" y="288" width="4" height="92" rx="2" fill="#ffc77a" />
<text x="634" y="314" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="27" font-weight="650" fill="#f2f6fc" text-anchor="start">Wait for service stage</text>
<text x="634" y="354" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="400" fill="#a9b8ce" text-anchor="start">Caller cannot continue yet</text>
<rect x="1001" y="270" width="359" height="128" rx="16" fill="#131f32" stroke="#2b3c54" stroke-width="2" />
<rect x="1001" y="288" width="4" height="92" rx="2" fill="#55e0c0" />
<text x="1025" y="314" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="27" font-weight="650" fill="#f2f6fc" text-anchor="start">Commit + post-commit</text>
<text x="1025" y="354" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="400" fill="#a9b8ce" text-anchor="start">Return Outcome</text>
<path d="M 547 334 L 610 334" fill="none" stroke="#7aafff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 600 327 L 610 334 L 600 341" fill="none" stroke="#7aafff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 938 334 L 1001 334" fill="none" stroke="#55e0c0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 991 327 L 1001 334 L 991 341" fill="none" stroke="#55e0c0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="52" y="494" width="1336" height="332" rx="20" fill="#131f32" stroke="#2b3c54" stroke-width="2" />
<text x="78" y="534" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" font-weight="700" fill="#c3a2ff" text-anchor="start">B / machine.async(() -&gt; tickets.complete(ticket))</text>
<text x="78" y="586" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="23" font-weight="650" fill="#f2f6fc" text-anchor="start">Caller</text>
<rect x="247" y="556" width="300" height="58" rx="10" fill="#0b1220" stroke="#c3a2ff" stroke-width="2" />
<text x="267" y="593" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="600" fill="#c3a2ff" text-anchor="start">Receive CompletableFuture</text>
<path d="M 547 585 L 1108 585" fill="none" stroke="#c3a2ff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 1098 578 L 1108 585 L 1098 592" fill="none" stroke="#c3a2ff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="815" y="573" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="21" font-weight="500" fill="#c3a2ff" text-anchor="middle">Continue with other work</text>
<text x="78" y="725" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="23" font-weight="650" fill="#f2f6fc" text-anchor="start">Worker</text>
<rect x="247" y="659" width="300" height="120" rx="16" fill="#131f32" stroke="#2b3c54" stroke-width="2" />
<rect x="247" y="677" width="4" height="84" rx="2" fill="#7aafff" />
<text x="271" y="703" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="27" font-weight="650" fill="#f2f6fc" text-anchor="start">Run operation</text>
<text x="271" y="743" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="400" fill="#a9b8ce" text-anchor="start">Guards + action</text>
<rect x="610" y="659" width="328" height="120" rx="16" fill="#131f32" stroke="#2b3c54" stroke-width="2" />
<rect x="610" y="677" width="4" height="84" rx="2" fill="#ffc77a" />
<text x="634" y="703" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="27" font-weight="650" fill="#f2f6fc" text-anchor="start">Wait for service stage</text>
<text x="634" y="743" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="400" fill="#a9b8ce" text-anchor="start">Same operation thread</text>
<rect x="1001" y="659" width="359" height="120" rx="16" fill="#131f32" stroke="#2b3c54" stroke-width="2" />
<rect x="1001" y="677" width="4" height="84" rx="2" fill="#55e0c0" />
<text x="1025" y="703" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="27" font-weight="650" fill="#f2f6fc" text-anchor="start">Commit + post-commit</text>
<text x="1025" y="743" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="400" fill="#a9b8ce" text-anchor="start">Complete the outer future</text>
<path d="M 547 719 L 610 719" fill="none" stroke="#7aafff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 600 712 L 610 719 L 600 726" fill="none" stroke="#7aafff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 938 719 L 1001 719" fill="none" stroke="#55e0c0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 991 712 L 1001 719 L 991 726" fill="none" stroke="#55e0c0" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 52 871 H 1388" fill="none" stroke="#2b3c54" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="52" y="906" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="400" fill="#a9b8ce" text-anchor="start">Calling join() immediately waits again. Async does not serialize concurrent operations on the same entity.</text>
</svg>
