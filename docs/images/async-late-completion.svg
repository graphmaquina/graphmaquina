<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">What happens after an async wait times out</title><desc id="desc">The engine aborts its wait and does not commit pending graph state. It does not cancel the user stage or remote work. A later service completion may still have external effects and does not resume the aborted transaction.</desc>
<defs>
  <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#15263e"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
  <linearGradient id="glow"><stop stop-color="#55e0c0" stop-opacity=".12"/><stop offset="1" stop-color="#7aafff" stop-opacity=".03"/></linearGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#7692b0" opacity=".12"/></pattern>
</defs>
<rect x="0" y="0" width="1440" height="820" rx="24" fill="url(#back)" />
<rect x="0" y="0" width="1440" height="820" rx="24" fill="url(#grid)" />
<text x="52" y="50" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#55e0c0" text-anchor="start">GRAPHMAQUINA / ASYNC / TIMEOUT</text>
<text x="52" y="108" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="43" font-weight="700" fill="#f2f6fc" text-anchor="start">The engine stopped waiting. The service may still run.</text>
<text x="52" y="151" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="24" font-weight="400" fill="#a9b8ce" text-anchor="start">Keep graph state, the user stage and the remote side effect separate.</text>
<text x="72" y="256" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="23" font-weight="650" fill="#f2f6fc" text-anchor="start">GraphMaquina</text>
<text x="72" y="441" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="23" font-weight="650" fill="#f2f6fc" text-anchor="start">User stage / service</text>
<path d="M 326 287 L 1330 287" fill="none" stroke="#a9b8ce" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 1320 280 L 1330 287 L 1320 294" fill="none" stroke="#a9b8ce" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 326 472 L 1330 472" fill="none" stroke="#a9b8ce" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 1320 465 L 1330 472 L 1320 479" fill="none" stroke="#a9b8ce" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="341" y="209" width="310" height="142" rx="16" fill="#131f32" stroke="#2b3c54" stroke-width="2" />
<rect x="341" y="227" width="4" height="106" rx="2" fill="#7aafff" />
<text x="365" y="253" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="27" font-weight="650" fill="#f2f6fc" text-anchor="start">Await action result</text>
<text x="365" y="293" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="400" fill="#a9b8ce" text-anchor="start">Pending graph changes</text>
<rect x="756" y="209" width="370" height="142" rx="16" fill="#131f32" stroke="#2b3c54" stroke-width="2" />
<rect x="756" y="227" width="4" height="106" rx="2" fill="#ff8998" />
<text x="780" y="253" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="27" font-weight="650" fill="#f2f6fc" text-anchor="start">Wait times out</text>
<text x="780" y="293" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="400" fill="#a9b8ce" text-anchor="start">Abort; no graph commit</text>
<rect x="341" y="394" width="310" height="142" rx="16" fill="#131f32" stroke="#2b3c54" stroke-width="2" />
<rect x="341" y="412" width="4" height="106" rx="2" fill="#c3a2ff" />
<text x="365" y="438" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="27" font-weight="650" fill="#f2f6fc" text-anchor="start">Request in flight</text>
<text x="365" y="478" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="400" fill="#a9b8ce" text-anchor="start">Library does not cancel it</text>
<rect x="1059" y="394" width="306" height="142" rx="16" fill="#131f32" stroke="#2b3c54" stroke-width="2" />
<rect x="1059" y="412" width="4" height="106" rx="2" fill="#ffc77a" />
<text x="1083" y="438" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="27" font-weight="650" fill="#f2f6fc" text-anchor="start">Service finishes later</text>
<text x="1083" y="478" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="400" fill="#a9b8ce" text-anchor="start">External effect may exist</text>
<path d="M 941 351 V 563" fill="none" stroke="#ff8998" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 8"/>
<text x="680" y="579" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="23" font-weight="600" fill="#ff8998" text-anchor="start">No automatic resume or late graph commit</text>
<rect x="52" y="625" width="1336" height="91" rx="16" fill="#131f32" stroke="#2b3c54" stroke-width="2" />
<text x="78" y="662" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#ffc77a" text-anchor="start">APPLICATION RESPONSIBILITY</text>
<text x="78" y="698" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="24" font-weight="400" fill="#a9b8ce" text-anchor="start">Use service deadlines, idempotency keys and reconciliation for uncertain external results.</text>
<path d="M 52 756 H 1388" fill="none" stroke="#2b3c54" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="52" y="791" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="400" fill="#a9b8ce" text-anchor="start">Timeout is a technical abort, not onFailure. Cancelling the outer operation future is not rollback either.</text>
</svg>
