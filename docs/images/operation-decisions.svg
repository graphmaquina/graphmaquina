<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img" aria-labelledby="title desc">
<title id="title">How an operation chooses its result</title><desc id="desc">FORBID is rejected. STAY, MOVE and ACTION evaluate guards; an accepted STAY is ignored and a rejected guard is rejected. A move or successful action commits. A declared failure route can commit an Outcome.Failed. Technical errors throw; post-commit errors can occur after state changed.</desc>
<defs>
  <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#15263e"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
  <linearGradient id="glow"><stop stop-color="#55e0c0" stop-opacity=".12"/><stop offset="1" stop-color="#7aafff" stop-opacity=".03"/></linearGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#7692b0" opacity=".12"/></pattern>
</defs>
<rect x="0" y="0" width="1440" height="1100" rx="24" fill="url(#back)" />
<rect x="0" y="0" width="1440" height="1100" rx="24" fill="url(#grid)" />
<text x="52" y="50" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" fill="#55e0c0" text-anchor="start">GRAPHMAQUINA / OPERATION FLOW</text>
<text x="52" y="108" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="43" font-weight="700" fill="#f2f6fc" text-anchor="start">Follow the decision, not just the destination.</text>
<text x="52" y="151" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="24" font-weight="400" fill="#a9b8ce" text-anchor="start">Simplified root operation; hooks, watches and listener follow a successful commit.</text>
<rect x="52" y="219" width="302" height="144" rx="16" fill="#131f32" stroke="#2b3c54" stroke-width="2" />
<rect x="52" y="237" width="4" height="108" rx="2" fill="#7aafff" />
<text x="76" y="263" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="27" font-weight="650" fill="#f2f6fc" text-anchor="start">Requested cell</text>
<text x="76" y="303" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="400" fill="#a9b8ce" text-anchor="start">Current state → target</text>
<rect x="491" y="219" width="344" height="144" rx="16" fill="#131f32" stroke="#2b3c54" stroke-width="2" />
<rect x="491" y="237" width="4" height="108" rx="2" fill="#c3a2ff" />
<text x="515" y="263" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="27" font-weight="650" fill="#f2f6fc" text-anchor="start">Evaluate guards</text>
<text x="515" y="303" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="400" fill="#a9b8ce" text-anchor="start">STAY / MOVE / ACTION</text>
<rect x="1002" y="219" width="386" height="144" rx="16" fill="#131f32" stroke="#2b3c54" stroke-width="2" />
<rect x="1002" y="237" width="4" height="108" rx="2" fill="#ffc77a" />
<text x="1026" y="263" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="27" font-weight="650" fill="#f2f6fc" text-anchor="start">Guard rejects</text>
<text x="1026" y="303" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="400" fill="#a9b8ce" text-anchor="start">Outcome.Rejected</text>
<text x="1026" y="334" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="400" fill="#a9b8ce" text-anchor="start">No staged state commit</text>
