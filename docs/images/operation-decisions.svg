<rect x="1002" y="461" width="386" height="144" rx="16" fill="#131f32" stroke="#2b3c54" stroke-width="2" />
<rect x="1002" y="479" width="4" height="108" rx="2" fill="#ff8998" />
<text x="1026" y="505" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="27" font-weight="650" fill="#f2f6fc" text-anchor="start">Business failure</text>
<text x="1026" y="545" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="400" fill="#a9b8ce" text-anchor="start">Select declared onFailure</text>
<text x="1026" y="576" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="400" fill="#a9b8ce" text-anchor="start">Missing route → exception</text>
<path d="M 835 533 L 1002 533" fill="none" stroke="#ff8998" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 992 526 L 1002 533 L 992 540" fill="none" stroke="#ff8998" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="911" y="505" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="600" fill="#ff8998" text-anchor="middle">failed()</text>
<rect x="491" y="720" width="344" height="144" rx="16" fill="#131f32" stroke="#2b3c54" stroke-width="2" />
<rect x="491" y="738" width="4" height="108" rx="2" fill="#55e0c0" />
