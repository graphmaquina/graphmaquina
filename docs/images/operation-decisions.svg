<rect x="491" y="461" width="344" height="144" rx="16" fill="#131f32" stroke="#2b3c54" stroke-width="2" />
<rect x="491" y="479" width="4" height="108" rx="2" fill="#c3a2ff" />
<text x="515" y="505" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="27" font-weight="650" fill="#f2f6fc" text-anchor="start">Select behavior</text>
<text x="515" y="545" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="400" fill="#a9b8ce" text-anchor="start">MOVE: no action</text>
<text x="515" y="576" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="400" fill="#a9b8ce" text-anchor="start">ACTION: run / await action</text>
<rect x="52" y="720" width="302" height="144" rx="16" fill="#131f32" stroke="#2b3c54" stroke-width="2" />
<rect x="52" y="738" width="4" height="108" rx="2" fill="#a9b8ce" />
<text x="76" y="764" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="27" font-weight="650" fill="#f2f6fc" text-anchor="start">Outcome.Ignored</text>
<text x="76" y="804" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="400" fill="#a9b8ce" text-anchor="start">STAY: no state change</text>
