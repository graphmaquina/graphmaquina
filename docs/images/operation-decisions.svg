<rect x="52" y="911" width="1336" height="158" rx="16" fill="#131f32" stroke="#2b3c54" stroke-width="2" />
<text x="78" y="947" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" font-weight="700" fill="#ffc77a" text-anchor="start">SUB-MACHINES</text>
<text x="78" y="981" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="24" font-weight="400" fill="#a9b8ce" text-anchor="start">Before resolving, a child that no parent holds: Rejected · DETACHED.</text>
<text x="78" y="1015" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="24" font-weight="400" fill="#a9b8ce" text-anchor="start">After resolving, an exit of the sub-machine bound to the origin: Rejected · RESERVED_EXIT.</text>
<text x="78" y="1049" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="24" font-weight="400" fill="#a9b8ce" text-anchor="start">A step that ends a sub-machine its parent still holds also commits the parent's exit; the outcome stays the step's.</text>

<rect x="52" y="1116" width="1336" height="89" rx="16" fill="#131f32" stroke="#2b3c54" stroke-width="2" />
<text x="78" y="1152" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" font-weight="700" fill="#ff8998" text-anchor="start">TECHNICAL EXCEPTION</text>
<text x="78" y="1186" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="24" font-weight="400" fill="#a9b8ce" text-anchor="start">A timeout aborts before commit. A hook failure may happen after commit. Neither becomes an Outcome.</text>
<path d="M 52 1241 H 1388" fill="none" stroke="#2b3c54" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="52" y="1276" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="400" fill="#a9b8ce" text-anchor="start">No second edge is ever tried: another edge reaching the same state is a different transition, and it is not a substitute.</text>
</svg>
