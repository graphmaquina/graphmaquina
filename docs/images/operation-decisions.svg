<text x="1026" y="804" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="400" fill="#a9b8ce" text-anchor="start">Outcome.Failed</text>
<text x="1026" y="835" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="400" fill="#a9b8ce" text-anchor="start">Actual state = movedTo()</text>
<path d="M 1195 605 L 1195 720" fill="none" stroke="#ff8998" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 1188 710 L 1195 720 L 1202 710" fill="none" stroke="#ff8998" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="1220" y="649" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="400" fill="#ff8998" text-anchor="start">route succeeds</text>
<rect x="52" y="911" width="1336" height="89" rx="16" fill="#131f32" stroke="#2b3c54" stroke-width="2" />
<text x="78" y="947" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" font-weight="700" fill="#ff8998" text-anchor="start">TECHNICAL EXCEPTION</text>
<text x="78" y="981" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="24" font-weight="400" fill="#a9b8ce" text-anchor="start">A timeout aborts before commit. A hook/listener failure may happen after commit.</text>
<path d="M 52 1036 H 1388" fill="none" stroke="#2b3c54" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="52" y="1071" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="400" fill="#a9b8ce" text-anchor="start">Handled failure is a normal Outcome. Inspect exceptions and watch reactions separately.</text>
</svg>
