<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1132" viewBox="0 0 1440 1132" role="img" aria-labelledby="title desc">
<title id="title">Sub-machines: one payment machine bound in two states of a booking</title><desc id="desc">The booking machine binds the same payment machine in two of its states, DEPOSIT and BALANCE. Each state is drawn as a cluster that holds the payment graph: AUTHORIZING and its three terminal states CAPTURED, DECLINED and VOIDED. BOOK enters DEPOSIT and starts the deposit payment at AUTHORIZING. A captured deposit exits through DEPOSIT_PAID, which moves the booking to BALANCE and starts the balance payment; a captured balance exits through BALANCE_PAID to CONFIRMED. A declined payment exits through DEPOSIT_DECLINED or BALANCE_DECLINED and a voided one through PAYMENT_VOIDED, both to CANCELLED. CANCEL leaves either state from its border, by an edge of the booking, and runs no exit. Entering a bound state starts the child; a child whose parent does not hold it, as when its booking has left the state, is rejected as DETACHED; the terminal state of the child selects the exit, which commits with the child in the same unit of work. The payment machine knows no parent, and the subscription machine binds it again in RENEWAL.</desc>
<defs>
  <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#15263e"/><stop offset="1" stop-color="#0b1220"/></linearGradient>
  <linearGradient id="glow"><stop stop-color="#55e0c0" stop-opacity=".12"/><stop offset="1" stop-color="#7aafff" stop-opacity=".03"/></linearGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#7692b0" opacity=".12"/></pattern>
</defs>
