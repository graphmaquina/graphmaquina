<text x="196" y="1022" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="400" fill="#a9b8ce" text-anchor="start">Payments knows no parent. Subscriptions binds the same machine in RENEWAL.</text>
<path d="M 52 1068 H 1388" fill="none" stroke="#2b3c54" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="52" y="1103" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" font-weight="400" fill="#a9b8ce" text-anchor="start">CANCEL leaves either state by an edge of the booking: no exit runs, and its action voids the payment it leaves.</text>
